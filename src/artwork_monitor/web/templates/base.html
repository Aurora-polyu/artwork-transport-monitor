<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Artwork Transportation Monitoring{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Artwork Transportation Monitoring</a>
    <nav aria-label="Primary navigation">
      <a href="/" aria-current="{% if request.path == '/' %}page{% else %}false{% endif %}">Dashboard</a>
      <a href="/transport">Transport</a>
      <a href="/gps">GPS</a>
      <a href="/check">Artwork Check</a>
      <a href="/report">Reports</a>
    </nav>
  </header>
  <main class="site-main">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
